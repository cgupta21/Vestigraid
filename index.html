<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vestigraid</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
<h1>Vestig<span>raid</span></h1>
<div class="sub">Every move leaves a mark. Every mark fights back.</div>
</header>
<main>
<div class="stage">
<canvas id="c"></canvas>
<div class="bar"><i id="tb"></i></div>
<div class="pad">
<div class="grid"><span></span><button data-k="up">▲</button><span></span><button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button></div>
<div class="side"><button data-k="strike">Strike</button><button data-k="loop">Loop</button><button data-k="pause">Pause</button><button data-k="reset">Reset</button></div>
</div>
<div id="ov"></div>
</div>
<aside class="file">
<span class="tag" id="lvn">CASE 01</span>
<h2 id="lvt">—</h2>
<p id="hint"></p>
<div>Loop <b id="loopn">1</b> · Shadows</div>
<div class="sh" id="sh"></div>
<div id="msg"></div>
<div class="keys"><kbd>WASD</kbd>/<kbd>↑←↓→</kbd> move<br><kbd>SPACE</kbd> strike ahead<br><kbd>R</kbd> end loop (leave shadow)<br><kbd>P</kbd>/<kbd>ESC</kbd> pause<br><kbd>Z</kbd> reset case<br>Shadows replay your moves, then freeze at the end and block you.</div>
</aside>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>

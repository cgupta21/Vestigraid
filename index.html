<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vestigraid</title>
<meta name="description" content="Vestigraid: a time-loop action puzzle where your past runs become your allies, then your enemies.">
<meta name="theme-color" content="#2a1f18">
<link rel="icon" type="image/svg+xml" href="brand/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="manifest" href="site.webmanifest">
<meta property="og:title" content="Vestigraid">
<meta property="og:type" content="website">
<meta property="og:description" content="Time-loop action puzzle: your past runs become your allies, then your enemies.">
<meta property="og:image" content="og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
<h1><img src="brand/logo-on-dark.svg" alt="Vestigraid" class="brand-logo"></h1>
<div class="sub">Every move leaves a mark. Every mark fights back.</div>
</header>
<main>
<div class="stage">
<canvas id="c"></canvas>
<div class="bar"><i id="tb"></i></div>
<div class="pad">
<div class="grid"><span></span><button data-k="up">▲</button><span></span><button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button></div>
<div class="side"><button data-k="strike">Strike</button><button data-k="loop">Loop</button><button data-k="pause">Pause</button><button data-k="reset">Reset</button></div>
</div>
<div id="ov"></div>
</div>
<aside class="file">
<span class="tag" id="lvn">CASE 01</span>
<h2 id="lvt">—</h2>
<p id="hint"></p>
<div>Loop <b id="loopn">1</b> · Shadows</div>
<div class="sh" id="sh"></div>
<div id="msg"></div>
<div class="keys"><kbd>WASD</kbd>/<kbd>↑←↓→</kbd> move<br><kbd>SPACE</kbd> strike ahead<br><kbd>R</kbd> end loop (leave shadow)<br><kbd>P</kbd>/<kbd>ESC</kbd> pause<br><kbd>Z</kbd> reset case<br>Shadows replay your moves, then freeze at the end and block you.</div>
</aside>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
